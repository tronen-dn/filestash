events {}

http {
    # Reverse-proxy with TLS termination in front of MinIO. MinIO speaks
    # HTTP on :9000 inside the compose network; this sidecar listens on
    # :9000 with TLS and forwards to http://minio:9000. The SUT
    # (Filestash) is configured with endpoint=https://nginx-tls:9000.
    #
    # `proxy_set_header Host` preserves what the client sent so AWS-SDK
    # v2 path-style requests don't fight with virtual-host bucket logic.
    # `client_max_body_size 0` disables nginx's default 1MB upload cap
    # (the round-trip test uploads 64 KiB which fits, but lifting the
    # cap removes a future foot-gun if the test grows).

    server {
        listen 9000 ssl;
        server_name nginx-tls;

        ssl_certificate     /etc/nginx/certs/nginx-tls.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 0;

        location / {
            proxy_pass http://minio:9000;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }
}
